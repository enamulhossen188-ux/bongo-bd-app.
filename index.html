<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bongo BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0e12;
            --surface-color: rgba(22, 23, 29, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #e50914;
            --accent-pink: #ff007f;
            --accent-glow: rgba(229, 9, 20, 0.5);
            --text-color: #f8fafc;
            --text-muted: #8e9bb0;
            --input-bg: #181920;
            --badge-bg: rgba(255, 0, 127, 0.15);
            --badge-text: #ff3385;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --surface-color: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --input-bg: #e2e8f0;
            --badge-bg: #ffe4e6;
            --badge-text: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 14px;
            transition: background 0.3s ease;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 14px;
        }

        .header h1 {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span { color: var(--primary); }

        .theme-toggle {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .search-container {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .category-box-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .category-chip {
            flex: 1 1 calc(33.333% - 8px);
            min-height: 42px;
            background: #1c1d24;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            padding: 4px 6px;
        }

        .category-chip.active {
            background: var(--primary) !important;
            color: #ffffff !important;
            border-color: var(--primary) !important;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        .category-glow-divider {
            display: none;
            width: 100%;
            height: 2px;
            background: radial-gradient(circle, #e50914 0%, rgba(229, 9, 20, 0.4) 60%, transparent 100%);
            box-shadow: 0 0 10px #e50914;
            margin: 10px 0 14px 0;
            border-radius: 2px;
        }

        .sub-category-scroll {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .sub-category-chip {
            flex: 1 1 calc(33.333% - 8px);
            min-height: 38px;
            background: #181920;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            padding: 4px 6px;
        }

        .sub-category-chip.active {
            background: var(--primary) !important;
            color: #ffffff !important;
            border-color: var(--primary) !important;
            box-shadow: 0 3px 10px rgba(229, 9, 20, 0.35);
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .video-card {
            background: var(--surface-color);
            border: 1.5px solid var(--accent-pink);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.2);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-card:active {
            transform: scale(0.98);
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .thumb-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-color);
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .category-tag {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .detail-view {
            display: none;
            padding: 4px 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-card {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            backdrop-filter: blur(14px);
        }

        .rotating-border-box {
            position: relative;
            padding: 2px;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .rotating-border-box::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 300%;
            background: conic-gradient(transparent, #ff007f, #ff3385, transparent 60%);
            animation: rotateGlow 3s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #detailThumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
            position: relative;
            z-index: 1;
            background: #000;
        }

        .detail-title-card {
            border: 1.5px solid var(--accent-pink);
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            margin-bottom: 12px;
            background: rgba(255, 0, 127, 0.03);
        }

        .unlock-info-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #ef4444;
            background: rgba(239, 68, 68, 0.08);
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .task-card-animated {
            position: relative;
            border-radius: 14px;
            padding: 2px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .task-card-animated::before {
            content: '';
            position: absolute;
            width: 250%;
            height: 250%;
            background: conic-gradient(transparent, transparent, #ff007f, #ff3385, #ff007f);
            animation: rotateTaskBorder 3.5s linear infinite;
        }

        @keyframes rotateTaskBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .task-card-row {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--input-bg);
            border-radius: 12px;
        }

        .task-info-left {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .task-icon {
            font-size: 18px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .task-icon.completed {
            color: #10b981;
        }

        .task-text h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .task-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .visit-action-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
        }

        .visit-action-btn.running {
            background: #0088cc;
            pointer-events: none;
        }

        .visit-action-btn.done {
            background: #10b981 !important;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4) !important;
            pointer-events: none;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        .download-btn.disabled {
            background: #1e293b;
            color: #64748b;
            pointer-events: none;
            box-shadow: none;
        }

        /* নেটিভ ব্যানার কন্টেইনার */
        .native-ad-container {
            width: 100%;
            min-height: 80px;
            margin-top: 14px;
            padding: 8px 4px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            text-align: center;
            overflow: visible;
            display: none;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 13px;
        }

        /* 🔥 কামিং সুন পপ-আপ 🔥 */
        .coming-soon-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 100000;
            align-items: center;
            justify-content: center;
        }

        .coming-soon-card {
            background: #181920;
            width: 88%;
            max-width: 330px;
            border-radius: 24px;
            padding: 28px 22px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .coming-soon-icon {
            font-size: 44px;
            color: #0099ff;
            margin-bottom: 16px;
        }

        .coming-soon-title {
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .coming-soon-desc {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .coming-soon-btn {
            background: #0099ff;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ভেরিফিকেশন ফেইল পপ-আপ */
        .custom-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(5px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }

        .custom-popup-card {
            background: #18191f;
            width: 86%;
            max-width: 320px;
            border-radius: 24px;
            padding: 26px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .popup-close-circle {
            width: 54px; height: 54px;
            background: #e61937;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 16px auto;
        }

        .popup-title {
            color: #ffffff;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .popup-desc {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .popup-highlight {
            color: #ef4444;
            font-weight: 700;
        }

        .popup-action-btn {
            background: #ffffff;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-circle-play"></i> <span>Bongo</span> BD</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"><i class="fa-solid fa-moon"></i> Dark</button>
    </div>

    <div id="mainView">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="নাটকের নাম বা পর্ব খুঁজুন..." oninput="handleSearch()">
        </div>

        <div class="category-box-grid" id="categoryTabs"></div>
        <div class="category-glow-divider" id="categoryGlowDivider"></div>
        <div class="sub-category-scroll" id="subCategoryTabs"></div>

        <div class="video-grid" id="videoContainer"></div>
        <div class="empty-msg" id="emptyMessage" style="display: none;">কোনো ভিডিও খুঁজে পাওয়া যায়নি!</div>
    </div>

    <div class="detail-view" id="detailView">
        <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> ফিরে যান</button>
        <div class="detail-card">
            
            <div class="rotating-border-box">
                <img id="detailThumb" src="" alt="Thumbnail" onerror="handleImageFallback(this)">
            </div>

            <div class="detail-title-card">
                <h2 id="detailTitle" style="font-size: 15px; font-weight: 700;"></h2>
            </div>

            <div class="unlock-info-box">
                <i class="fa-solid fa-lock" style="color: #ef4444;"></i>
                <span>ভিডিওটি আনলক করার জন্য নিচের দুইটা এড দেখে নিন ১০ সেকেন্ড করে।</span>
            </div>

            <div class="task-list">
                <div class="task-card-animated">
                    <div class="task-card-row">
                        <div class="task-info-left">
                            <i id="task1Icon" class="fa-solid fa-circle-check task-icon"></i>
                            <div class="task-text">
                                <h4>Task 1</h4>
                                <p id="task1Desc">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                            </div>
                        </div>
                        <button id="task1Btn" class="visit-action-btn" onclick="startTask(1)">VISIT</button>
                    </div>
                </div>

                <div class="task-card-animated">
                    <div class="task-card-row">
                        <div class="task-info-left">
                            <i id="task2Icon" class="fa-solid fa-circle-check task-icon"></i>
                            <div class="task-text">
                                <h4>Task 2</h4>
                                <p id="task2Desc">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                            </div>
                        </div>
                        <button id="task2Btn" class="visit-action-btn" onclick="startTask(2)">VISIT</button>
                    </div>
                </div>
            </div>

            <button id="downloadBtn" class="download-btn disabled" onclick="sendToInbox()">
                <i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও
            </button>

            <!-- নেটিভ ব্যানার বক্স -->
            <div id="nativeAdBox" class="native-ad-container"></div>
        </div>
    </div>

    <!-- 🔥 কামিং সুন পপ-আপ 🔥 -->
    <div id="comingSoonPopup" class="coming-soon-popup-overlay">
        <div class="coming-soon-card">
            <div class="coming-soon-icon"><i class="fa-solid fa-bullhorn"></i></div>
            <div class="coming-soon-title" id="csPopupTitle"></div>
            <div class="coming-soon-desc" id="csPopupNotice"></div>
            <button class="coming-soon-btn" onclick="closeComingSoonPopup()">Close</button>
        </div>
    </div>

    <!-- ভেরিফিকেশন ফেইল পপ-আপ -->
    <div id="verifyFailPopup" class="custom-popup-overlay">
        <div class="custom-popup-card">
            <div class="popup-close-circle"><i class="fa-solid fa-xmark"></i></div>
            <div class="popup-title">ভেরিফিকেশন ব্যর্থ!</div>
            <div class="popup-desc">
                আপনি সম্পূর্ণ ১০ সেকেন্ড অ্যাড দেখেন নাই!<br>
                দেখেছেন <span id="seenSecondsTxt" class="popup-highlight">0</span> সেঃ। আরও <span id="needSecondsTxt" class="popup-highlight">10</span> সেঃ প্রয়োজন।
            </div>
            <button class="popup-action-btn" onclick="closePopup()">বুঝতে পেরেছি</button>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://bongo-bd-app-uixi.onrender.com";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let appData = { videos: [], ads: {}, categories: [], sub_categories: {} };
        let activeCategory = '';
        let activeSubCategory = 'ALL';
        let currentSelectedVideo = null;

        let task1Done = false;
        let task2Done = false;
        let activeTask = null;
        let taskStartTime = 0;
        let countdownTimer = null;

        const SAFE_FALLBACK_SVG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="%2311141a"/><circle cx="320" cy="180" r="42" fill="%23e50914" fill-opacity="0.85"/><polygon points="310,165 338,180 310,195" fill="%23ffffff"/></svg>';

        function handleImageFallback(img) {
            const original = img.getAttribute("data-original");
            if (!img.dataset.retried && original && original.startsWith("http") && !original.includes("weserv.nl")) {
                img.dataset.retried = "true";
                img.src = `https://images.weserv.nl/?url=${encodeURIComponent(original)}&w=640&fit=cover&output=jpg&q=85`;
                return;
            }
            img.onerror = null;
            img.src = SAFE_FALLBACK_SVG;
        }

        function resolveThumb(url) {
            if (!url) return SAFE_FALLBACK_SVG;
            let u = url.trim();
            if (u.includes("placehold.co")) return SAFE_FALLBACK_SVG;
            if (u.includes("api.telegram.org")) {
                return `https://images.weserv.nl/?url=${encodeURIComponent(u)}&w=640&fit=cover&output=jpg&q=85`;
            }
            return u;
        }

        function injectAdScriptSilently(codeStr) {
            if (!codeStr || !codeStr.trim()) return;
            let raw = codeStr.trim();
            let srcMatch = raw.match(/src=["'](.*?)["']/);
            let finalSrc = srcMatch ? srcMatch[1] : (raw.startsWith("http") ? raw : null);

            const scriptElem = document.createElement("script");
            scriptElem.type = "text/javascript";
            scriptElem.async = true;
            if (finalSrc) {
                scriptElem.src = finalSrc;
            } else {
                scriptElem.text = raw.replace(/<\/?script[^>]*>/gi, "");
            }
            document.head.appendChild(scriptElem);
        }

        function executePopunder(popCode) {
            if (!popCode || !popCode.trim()) return;
            let raw = popCode.trim();

            if (raw.startsWith("http") && !raw.includes(".js")) {
                let popDone = false;
                const openDirectLink = () => {
                    if (!popDone) {
                        popDone = true;
                        if (tg && tg.openLink) tg.openLink(raw);
                        else window.open(raw, "_blank");
                        document.removeEventListener("click", openDirectLink);
                    }
                };
                document.addEventListener("click", openDirectLink, { once: true });
                return;
            }
            injectAdScriptSilently(raw);
        }

        function executeSocialBar(socialCode) {
            injectAdScriptSilently(socialCode);
        }

        function injectNativeBanner(container, codeStr) {
            if (!codeStr || !codeStr.trim() || !container) {
                if (container) container.style.display = "none";
                return;
            }
            container.style.display = "block";
            container.innerHTML = "";

            let raw = codeStr.trim();
            const doc = new DOMParser().parseFromString(raw, "text/html");

            const divs = doc.querySelectorAll("div");
            divs.forEach(d => container.appendChild(d.cloneNode(true)));

            const scripts = doc.querySelectorAll("script");
            if (scripts.length > 0) {
                scripts.forEach(sc => {
                    const s = document.createElement("script");
                    if (sc.src) s.src = sc.src;
                    if (sc.getAttribute("data-cfasync")) s.setAttribute("data-cfasync", sc.getAttribute("data-cfasync"));
                    s.text = sc.innerHTML;
                    container.appendChild(s);
                });
            } else if (raw.startsWith("http")) {
                const s = document.createElement("script");
                s.src = raw;
                container.appendChild(s);
            }
        }

        function renderAllAds() {
            const ads = appData.ads || {};
            if (ads.social_ad) {
                executeSocialBar(ads.social_ad);
            }
            if (ads.popunder_ad) {
                executePopunder(ads.popunder_ad);
            }
        }

        async function initData() {
            try {
                const res = await fetch(`${SERVER_URL}/api/data?t=${Date.now()}`, {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                appData = await res.json();
                
                const cats = appData.categories || ["BPS5", "MOVIES", "DRAMA", "SERIES", "COMING SOON"];
                if (cats.length > 0 && !activeCategory) {
                    activeCategory = cats[0];
                }
                
                renderCategoryTabs();
                renderSubCategories();
                renderVideos();
                renderAllAds();
            } catch (err) {
                console.error("ডাটা লোড ত্রুটি:", err);
            }
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById("categoryTabs");
            const cats = appData.categories || ["BPS5", "MOVIES", "DRAMA", "SERIES", "COMING SOON"];
            
            let html = '';
            cats.forEach((c) => {
                const isActive = (activeCategory.trim().toUpperCase() === c.trim().toUpperCase());
                html += `<div class="category-chip ${isActive ? 'active' : ''}" onclick="filterCategory('${c}')">${c}</div>`;
            });
            tabsContainer.innerHTML = html;
        }

        function renderSubCategories() {
            const subContainer = document.getElementById("subCategoryTabs");
            const divider = document.getElementById("categoryGlowDivider");
            const subMap = appData.sub_categories || {};

            const activeKey = Object.keys(subMap).find(
                k => k.trim().toUpperCase() === activeCategory.trim().toUpperCase()
            );
            const userSubList = activeKey ? subMap[activeKey] : [];

            if (userSubList && userSubList.length > 0) {
                divider.style.display = "block";
                subContainer.style.display = "flex";

                const uniqueSubs = [...new Set(userSubList.map(s => s.trim()))];

                if (!uniqueSubs.some(s => s.toUpperCase() === activeSubCategory.toUpperCase())) {
                    activeSubCategory = uniqueSubs[0];
                }

                let html = '';
                uniqueSubs.forEach(sub => {
                    const isActive = (activeSubCategory.trim().toUpperCase() === sub.trim().toUpperCase());
                    html += `<div class="sub-category-chip ${isActive ? 'active' : ''}" onclick="filterSubCategory('${sub}')">${sub}</div>`;
                });
                subContainer.innerHTML = html;
            } else {
                divider.style.display = "none";
                subContainer.style.display = "none";
                activeSubCategory = 'ALL';
            }
        }

        function filterCategory(cat) {
            activeCategory = cat;
            activeSubCategory = 'ALL';
            renderCategoryTabs();
            renderSubCategories();
            renderVideos();
        }

        function filterSubCategory(sub) {
            activeSubCategory = sub;
            const subContainer = document.getElementById("subCategoryTabs");
            const chips = subContainer.querySelectorAll(".sub-category-chip");
            chips.forEach(chip => {
                if (chip.innerText.trim().toUpperCase() === sub.trim().toUpperCase()) {
                    chip.classList.add("active");
                } else {
                    chip.classList.remove("active");
                }
            });
            renderVideos();
        }

        function renderVideos() {
            const container = document.getElementById("videoContainer");
            const empty = document.getElementById("emptyMessage");
            const query = document.getElementById("searchInput").value.toLowerCase().trim();

            let list = appData.videos || [];

            if (activeCategory) {
                list = list.filter(v => (v.category || '').trim().toUpperCase() === activeCategory.trim().toUpperCase());
            }

            if (activeSubCategory && activeSubCategory !== 'ALL') {
                list = list.filter(v => {
                    const subField = (v.sub_category || '').trim().toUpperCase();
                    const titleText = (v.title || '').trim().toUpperCase();
                    return !subField || subField === activeSubCategory.trim().toUpperCase() || titleText.includes(activeSubCategory.trim().toUpperCase());
                });
            }

            if (query) {
                list = list.filter(v => (v.title || '').toLowerCase().includes(query));
            }

            container.innerHTML = "";
            if (list.length === 0) {
                empty.style.display = "block";
            } else {
                empty.style.display = "none";
                list.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "video-card";
                    card.onclick = () => handleItemClick(item);
                    
                    const thumbUrl = resolveThumb(item.thumb);

                    card.innerHTML = `
                        <div class="thumb-wrapper">
                            <img class="thumb-img" src="${thumbUrl}" data-original="${item.thumb || ''}" alt="Thumb" loading="lazy" onerror="handleImageFallback(this)">
                        </div>
                        <div class="card-details">
                            <div class="video-title">${item.title}</div>
                            <div class="video-meta">
                                <span class="category-tag">${item.sub_category || item.category || 'নাটক'}</span>
                                <span><i class="fa-regular fa-clock"></i> ${item.date || ''}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function handleSearch() {
            renderVideos();
        }

        // 🔥 কামিং সুন পোস্টে টাস্ক পেজ ছাড়া পপ-আপ ওপেন করা 🔥
        function handleItemClick(item) {
            const isCS = item.is_coming_soon || (item.category && item.category.trim().toUpperCase() === "COMING SOON");
            if (isCS) {
                document.getElementById("csPopupTitle").innerText = item.title;
                document.getElementById("csPopupNotice").innerText = item.notice || "এই পর্বটি খুব শীঘ্রই আসছে। আমাদের সাথেই থাকুন!";
                document.getElementById("comingSoonPopup").style.display = "flex";
            } else {
                openDetail(item);
            }
        }

        function closeComingSoonPopup() {
            document.getElementById("comingSoonPopup").style.display = "none";
        }

        function openDetail(video) {
            currentSelectedVideo = video;
            document.getElementById("mainView").style.display = "none";
            document.getElementById("detailView").style.display = "block";

            const detailImg = document.getElementById("detailThumb");
            detailImg.setAttribute("data-original", video.thumb || "");
            detailImg.removeAttribute("data-retried");
            detailImg.src = resolveThumb(video.thumb);
            document.getElementById("detailTitle").innerText = video.title;

            const ads = appData.ads || {};
            if (ads.native_ad) {
                injectNativeBanner(document.getElementById("nativeAdBox"), ads.native_ad);
            }

            resetTasks();
        }

        function resetTasks() {
            task1Done = false;
            task2Done = false;
            activeTask = null;
            if (countdownTimer) clearInterval(countdownTimer);

            const btn1 = document.getElementById("task1Btn");
            const btn2 = document.getElementById("task2Btn");
            const dlBtn = document.getElementById("downloadBtn");

            btn1.className = "visit-action-btn";
            btn1.innerHTML = "VISIT";
            document.getElementById("task1Icon").className = "fa-solid fa-circle-check task-icon";
            document.getElementById("task1Desc").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            btn2.className = "visit-action-btn";
            btn2.innerHTML = "VISIT";
            document.getElementById("task2Icon").className = "fa-solid fa-circle-check task-icon";
            document.getElementById("task2Desc").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            dlBtn.className = "download-btn disabled";
            dlBtn.innerHTML = `<i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও`;
        }

        function goBack() {
            if (countdownTimer) clearInterval(countdownTimer);
            activeTask = null;
            document.getElementById("detailView").style.display = "none";
            document.getElementById("mainView").style.display = "block";
        }

        function startTask(taskNum) {
            if (taskNum === 1 && task1Done) return;
            if (taskNum === 2 && task2Done) return;

            activeTask = taskNum;
            taskStartTime = Date.now();

            const adUrl = (taskNum === 1) ? (appData.ads?.ad1 || "https://google.com") : (appData.ads?.ad2 || "https://google.com");

            if (tg && tg.openLink) {
                tg.openLink(adUrl);
            } else {
                window.open(adUrl, "_blank");
            }

            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const desc = document.getElementById(taskNum === 1 ? "task1Desc" : "task2Desc");

            btn.className = "visit-action-btn running";
            btn.innerHTML = `10s`;
            desc.innerText = "অপেক্ষা করুন...";

            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                const passed = Math.floor((Date.now() - taskStartTime) / 1000);
                const remaining = 10 - passed;

                if (remaining > 0) {
                    btn.innerHTML = `${remaining}s`;
                } else {
                    clearInterval(countdownTimer);
                    completeTask(taskNum);
                }
            }, 500);
        }

        function completeTask(taskNum) {
            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const icon = document.getElementById(taskNum === 1 ? "task1Icon" : "task2Icon");
            const desc = document.getElementById(taskNum === 1 ? "task1Desc" : "task2Desc");

            btn.className = "visit-action-btn done";
            btn.innerHTML = `DONE`;
            icon.classList.add("completed");
            desc.innerText = "টাস্ক সম্পন্ন হয়েছে ✅";

            if (taskNum === 1) task1Done = true;
            if (taskNum === 2) task2Done = true;

            activeTask = null;

            if (task1Done && task2Done) {
                const dlBtn = document.getElementById("downloadBtn");
                dlBtn.className = "download-btn";
            }
        }

        function showFailedPopup(seenSec, needSec) {
            document.getElementById("seenSecondsTxt").innerText = seenSec;
            document.getElementById("needSecondsTxt").innerText = needSec;
            document.getElementById("verifyFailPopup").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("verifyFailPopup").style.display = "none";
        }

        function handleVisibilityOrFocus() {
            if (document.visibilityState === "visible" && activeTask !== null) {
                const elapsedSeconds = Math.floor((Date.now() - taskStartTime) / 1000);

                if (elapsedSeconds < 10) {
                    clearInterval(countdownTimer);
                    const taskFailed = activeTask;
                    activeTask = null;

                    const btn = document.getElementById(taskFailed === 1 ? "task1Btn" : "task2Btn");
                    const desc = document.getElementById(taskFailed === 1 ? "task1Desc" : "task2Desc");

                    btn.className = "visit-action-btn";
                    btn.innerHTML = `VISIT`;
                    desc.innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

                    const remainingNeed = 10 - (elapsedSeconds < 0 ? 0 : elapsedSeconds);
                    showFailedPopup(elapsedSeconds < 0 ? 0 : elapsedSeconds, remainingNeed);
                } else {
                    clearInterval(countdownTimer);
                    completeTask(activeTask);
                }
            }
        }

        document.addEventListener("visibilitychange", handleVisibilityOrFocus);
        window.addEventListener("focus", handleVisibilityOrFocus);

        // 🔥 নিশ্চিত ২ সেকেন্ড লোডিং নিয়ে ইনবক্সে পাঠানো 🔥
        async function sendToInbox() {
            if (!task1Done || !task2Done) return;

            const dlBtn = document.getElementById("downloadBtn");
            dlBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ইনবক্সে পাঠানো হচ্ছে...`;
            dlBtn.classList.add("disabled");

            const userId = tg?.initDataUnsafe?.user?.id;

            if (!userId) {
                alert("ইউজার আইডি পাওয়া যায়নি! টেলিগ্রাম অ্যাপ থেকে মিনি অ্যাপটি ওপেন করুন।");
                dlBtn.innerHTML = `<i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও`;
                dlBtn.classList.remove("disabled");
                return;
            }

            try {
                const res = await fetch(`${SERVER_URL}/api/send_video`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        video_id: currentSelectedVideo.id
                    })
                });

                const data = await res.json();
                if (data.success) {
                    dlBtn.innerHTML = `✅ সফল হয়েছে!`;
                    setTimeout(() => {
                        if (tg && tg.close) tg.close();
                    }, 500);
                } else {
                    alert("ভিডিও পাঠানো যায়নি। অনুগ্রহ করে আবার চেষ্টা করুন।");
                    dlBtn.innerHTML = `<i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও`;
                    dlBtn.classList.remove("disabled");
                }
            } catch (err) {
                console.error("ভিডিও সেন্ড এরর:", err);
                alert("সার্ভারে সংযোগ দেওয়া যাচ্ছে না। অনুগ্রহ করে ২ সেকেন্ড পর আবার চেষ্টা করুন।");
                dlBtn.innerHTML = `<i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও`;
                dlBtn.classList.remove("disabled");
            }
        }

        function toggleTheme() {
            document.body.classList.toggle("light-mode");
            const btn = document.getElementById("themeBtn");
            if (document.body.classList.contains("light-mode")) {
                btn.innerHTML = `<i class="fa-solid fa-sun"></i> Light`;
            } else {
                btn.innerHTML = `<i class="fa-solid fa-moon"></i> Dark`;
            }
        }

        initData();
    </script>
