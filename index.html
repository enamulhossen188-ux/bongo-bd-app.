<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bongo BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0e12;
            --surface-color: rgba(22, 23, 29, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #ff007f 0%, #ff0055 100%);
            --accent-pink: #ff007f;
            --text-color: #f8fafc;
            --text-muted: #8e9bb0;
            --input-bg: #181920;
            --badge-bg: rgba(255, 0, 127, 0.15);
            --badge-text: #ff3385;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 14px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 14px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-container {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 6px 14px;
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            color: var(--text-muted);
            cursor: pointer;
        }

        .category-chip.active {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 600;
            border: none;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .video-card {
            background: var(--surface-color);
            border: 1.5px solid var(--accent-pink);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #181920;
        }

        .thumb-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-color);
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
        }

        .category-tag {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .detail-view {
            display: none;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-card {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
        }

        #detailThumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1.5px solid var(--accent-pink);
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: #10b981;
            color: #fff;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa-solid fa-circle-play"></i> Bongo BD</h1>
    </div>

    <div id="mainView">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ভিডিও বা পর্ব খুঁজুন..." oninput="renderVideos()">
        </div>

        <div class="category-scroll" id="categoryTabs"></div>
        <div class="video-grid" id="videoContainer"></div>
        <div class="empty-msg" id="emptyMessage" style="display: none;">এই ক্যাটাগরিতে কোনো ভিডিও নেই!</div>
    </div>

    <div class="detail-view" id="detailView">
        <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> ফিরে যান</button>
        <div class="detail-card">
            <img id="detailThumb" src="" alt="Thumbnail">
            <h2 id="detailTitle" style="font-size: 16px; font-weight: 700; margin-bottom: 14px;"></h2>
            <button id="downloadBtn" class="download-btn" onclick="sendToInbox()">
                <i class="fa-solid fa-download"></i> ইনবক্সে ভিডিও নিন
            </button>
        </div>
    </div>

    <script>
        const BOT_USERNAME = "BongoBd_ot_Bot";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let appData = { videos: [], categories: [] };
        let activeCategory = 'Top';
        let currentSelectedVideo = null;

        async function initData() {
            try {
                const res = await fetch(`/api/data?t=${Date.now()}`, { cache: 'no-store' });
                if (res.ok) {
                    appData = await res.json();
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }

            renderCategoryTabs();
            renderVideos();
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById("categoryTabs");
            const cats = appData.categories?.length ? appData.categories : ["Top", "BPS5", "MOVIES", "DRAMA", "SERIES"];
            let html = '';
            cats.forEach(c => {
                const isActive = activeCategory.toLowerCase() === c.toLowerCase();
                html += `<div class="category-chip ${isActive ? 'active' : ''}" onclick="selectCategory('${c}', this)">${c}</div>`;
            });
            tabsContainer.innerHTML = html;
        }

        function selectCategory(cat, el) {
            activeCategory = cat;
            document.querySelectorAll(".category-chip").forEach(c => c.classList.remove("active"));
            if (el) el.classList.add("active");
            renderVideos();
        }

        function renderVideos() {
            const container = document.getElementById("videoContainer");
            const empty = document.getElementById("emptyMessage");
            const query = (document.getElementById("searchInput").value || "").toLowerCase().trim();

            let list = appData.videos || [];

            if (activeCategory.toLowerCase() !== 'top' && activeCategory.toLowerCase() !== 'all') {
                list = list.filter(v => {
                    const c = (v.category || '').toLowerCase();
                    const t = (v.title || '').toLowerCase();
                    const target = activeCategory.toLowerCase();
                    return c === target || c.includes(target) || (target === 'bps5' && (c.includes('bps5') || t.includes('bachelor point')));
                });
            }

            if (query) {
                list = list.filter(v => (v.title || '').toLowerCase().includes(query));
            }

            container.innerHTML = "";
            if (list.length === 0) {
                empty.style.display = "block";
            } else {
                empty.style.display = "none";
                list.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "video-card";
                    card.onclick = () => openDetail(item);
                    card.innerHTML = `
                        <div class="thumb-wrapper">
                            <img class="thumb-img" src="${item.thumb || 'https://placehold.co/640x360?text=Bongo+BD'}" alt="Thumb" loading="lazy">
                        </div>
                        <div class="card-details">
                            <div class="video-title">${item.title}</div>
                            <div class="video-meta">
                                <span class="category-tag">${item.category || 'Top'}</span>
                                <span>${item.date || ''}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function openDetail(video) {
            currentSelectedVideo = video;
            document.getElementById("mainView").style.display = "none";
            document.getElementById("detailView").style.display = "block";
            document.getElementById("detailThumb").src = video.thumb || 'https://placehold.co/640x360?text=Bongo+BD';
            document.getElementById("detailTitle").innerText = video.title;
        }

        function goBack() {
            document.getElementById("detailView").style.display = "none";
            document.getElementById("mainView").style.display = "block";
        }

        function sendToInbox() {
            if (currentSelectedVideo) {
                const targetUrl = `https://t.me/${BOT_USERNAME}?start=vid_${currentSelectedVideo.id}`;
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(targetUrl);
                } else {
                    window.location.href = targetUrl;
                }
                if (tg && tg.close) setTimeout(() => tg.close(), 300);
            }
        }

        initData();
    </script>
</body>
    </html>
